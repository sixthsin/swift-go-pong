<!DOCTYPE html>
<html>

<head>
    <title>Pong Game Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background: #f0f0f0;
        }

        #game-container {
            display: inline-block;
            position: relative;
            margin: 20px auto;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        #game-display {
            width: 500px;
            height: 700px;
            border: 2px solid #333;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        .paddle {
            width: 75px;
            height: 10px;
            background: #fff;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 5px;
        }

        #top-paddle {
            top: 35px;
            background: #f44336;
        }

        #bottom-paddle {
            bottom: 35px;
            background: #4CAF50;
        }

        #ball {
            width: 15px;
            height: 15px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        #status {
            color: white;
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 14px;
        }

        #controls {
            margin: 15px;
        }

        button {
            padding: 10px 20px;
            margin: 0 10px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        input {
            padding: 8px;
            width: 200px;
        }

        #debug {
            margin-top: 20px;
            padding: 10px;
            background: white;
            border: 1px solid #ddd;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>

<body>
    <h1>Pong Game Test</h1>
    <div id="controls">
        <button id="createGameBtn">Create Game</button>
        <div>
            <input type="text" id="gameIdInput" placeholder="Enter Game ID">
            <button id="joinGameBtn">Join Game</button>
        </div>
    </div>

    <div id="game-container">
        <div id="game-display">
            <div id="status">Disconnected</div>
            <div id="top-paddle" class="paddle"></div>
            <div id="bottom-paddle" class="paddle"></div>
            <div id="ball"></div>
        </div>
    </div>

    <div id="debug"></div>

    <script>
        // Конфигурация
        const API_BASE_URL = 'http://localhost:8080';
        let socket = null;
        let gameId = null;
        let isConnected = false;
        let isPlayerOne = false;

        // Элементы интерфейса
        const createGameBtn = document.getElementById('createGameBtn');
        const joinGameBtn = document.getElementById('joinGameBtn');
        const gameIdInput = document.getElementById('gameIdInput');
        const statusDiv = document.getElementById('status');
        const debugDiv = document.getElementById('debug');
        const topPaddle = document.getElementById('top-paddle');
        const bottomPaddle = document.getElementById('bottom-paddle');
        const ball = document.getElementById('ball');
        const gameDisplay = document.getElementById('game-display');

        // Логирование
        function logMessage(msg) {
            const p = document.createElement('p');
            p.textContent = msg;
            debugDiv.appendChild(p);
            debugDiv.scrollTop = debugDiv.scrollHeight;
        }

        // Создание игры
        createGameBtn.addEventListener('click', async () => {
            const gameId = prompt("Enter Game ID to create:");
            if (!gameId) return;

            try {
                const response = await fetch(`${API_BASE_URL}/api/game/create?game_id=${encodeURIComponent(gameId)}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(await response.text());
                }

                statusDiv.textContent = `Game ${gameId} created. Waiting for player...`;
                connectWebSocket(gameId, true);
                logMessage(`Game ${gameId} created successfully`);
            } catch (err) {
                statusDiv.textContent = `Error: ${err.message}`;
                logMessage(`Error creating game: ${err.message}`);
            }
        });

        // Подключение к игре
        joinGameBtn.addEventListener('click', async () => {
            const gameId = gameIdInput.value.trim();
            if (!gameId) {
                logMessage("Please enter Game ID");
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/game/join?game_id=${encodeURIComponent(gameId)}`);

                if (!response.ok) {
                    throw new Error(await response.text());
                }

                statusDiv.textContent = `Joining game ${gameId}...`;
                connectWebSocket(gameId, false);
                logMessage(`Joined game ${gameId} successfully`);
            } catch (err) {
                statusDiv.textContent = `Error: ${err.message}`;
                logMessage(`Error joining game: ${err.message}`);
            }
        });

        // WebSocket подключение
        function connectWebSocket(gameId, isCreator) {
            isPlayerOne = isCreator;
            const wsUrl = `ws://localhost:8080/ws?game_id=${gameId}`;

            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                isConnected = true;
                statusDiv.textContent = `Connected to ${gameId} as ${isPlayerOne ? 'player1' : 'player2'}`;
                logMessage("WebSocket connected");
            };

            socket.onmessage = (event) => {
                try {
                    const gameState = JSON.parse(event.data);
                    updateGameState(gameState);
                } catch (err) {
                    logMessage(`Error parsing message: ${err}`);
                }
            };

            socket.onclose = () => {
                isConnected = false;
                statusDiv.textContent = "Disconnected";
                logMessage("Connection closed");
            };

            socket.onerror = (error) => {
                logMessage(`WebSocket error: ${error.message}`);
            };
        }

        // Обновление состояния игры (ваш оригинальный код)
        function updateGameState(gameState) {
            // Обновляем ракетки
            if (gameState.players) {
                if (gameState.players.player1) {
                    bottomPaddle.style.left = `${gameState.players.player1.x * 100}%`;
                }
                if (gameState.players.player2) {
                    topPaddle.style.left = `${gameState.players.player2.x * 100}%`;
                }
            }

            // Обновляем мяч
            if (gameState.ball) {
                ball.style.left = `${gameState.ball.x * 100}%`;
                ball.style.top = `${gameState.ball.y * 100}%`;
            }

            // Обновляем статус
            if (gameState.started) {
                statusDiv.textContent = "Game started";
            }
        }

        // Управление ракеткой (ваш оригинальный код)
        gameDisplay.addEventListener('mousemove', (e) => {
            if (!isConnected) return;

            const rect = gameDisplay.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const clampedX = Math.max(0.075, Math.min(0.925, x));

            const moveMsg = {
                type: "racket_move",
                x: clampedX
            };

            socket.send(JSON.stringify(moveMsg));
        });

        // Тестовая отправка случайного движения (ваш оригинальный код)
        document.addEventListener('keydown', (e) => {
            if (!isConnected) {
                logMessage("Not connected!");
                return;
            }

            if (e.key === 'r') {
                const randomX = Math.random();
                const moveMsg = {
                    type: "racket_move",
                    x: randomX
                };

                socket.send(JSON.stringify(moveMsg));
                logMessage(`Sent random position: ${randomX.toFixed(2)}`);
            }
        });
    </script>
</body>

</html>
