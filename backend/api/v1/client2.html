<!DOCTYPE html>
<html>

<head>
    <title>Pong Game Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background: #f0f0f0;
        }

        #game-container {
            display: inline-block;
            position: relative;
            margin: 20px auto;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        #game-display {
            width: 500px;
            height: 700px;
            border: 2px solid #333;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        .paddle {
            width: 75px;
            /* 15% от 500px */
            height: 10px;
            background: #fff;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 5px;
        }

        #top-paddle {
            top: 35px;
            /* 5% от 700px */
            background: #f44336;
        }

        #bottom-paddle {
            bottom: 35px;
            background: #4CAF50;
        }

        #ball {
            width: 15px;
            height: 15px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        #status {
            color: white;
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 14px;
        }

        #controls {
            margin: 15px;
        }

        button {
            padding: 10px 20px;
            margin: 0 10px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        #debug {
            margin-top: 20px;
            padding: 10px;
            background: white;
            border: 1px solid #ddd;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>

<body>
    <h1>Pong Game Test</h1>
    <div id="controls">
        <button id="connectBtn">Connect</button>
        <button id="randomMoveBtn">Random Move</button>
    </div>

    <div id="game-container">
        <div id="game-display">
            <div id="status">Disconnected</div>
            <div id="top-paddle" class="paddle"></div>
            <div id="bottom-paddle" class="paddle"></div>
            <div id="ball"></div>
        </div>
    </div>

    <div id="debug"></div>

    <script>
        const connectBtn = document.getElementById('connectBtn');
        const randomMoveBtn = document.getElementById('randomMoveBtn');
        const statusDiv = document.getElementById('status');
        const debugDiv = document.getElementById('debug');
        const topPaddle = document.getElementById('top-paddle');
        const bottomPaddle = document.getElementById('bottom-paddle');
        const ball = document.getElementById('ball');
        const gameDisplay = document.getElementById('game-display');

        let socket = null;
        let isConnected = false;
        let playerId = null;
        let isPlayerOne = false;

        // Подключение к WebSocket
        connectBtn.addEventListener('click', () => {
            if (isConnected) {
                socket.close();
                return;
            }

            socket = new WebSocket('ws://localhost:8080/ws');

            socket.onopen = () => {
                isConnected = true;
                statusDiv.textContent = "Connected";
                connectBtn.textContent = "Disconnect";
                logMessage("Connected to server");
            };

            socket.onclose = () => {
                isConnected = false;
                statusDiv.textContent = "Disconnected";
                connectBtn.textContent = "Connect";
                logMessage("Disconnected from server");
            };

            socket.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    // logMessage(`Received: ${JSON.stringify(data)}`);

                    // Обновляем состояние игры
                    updateGameState(data);
                } catch (err) {
                    logMessage(`Error parsing message: ${err}`);
                }
            };

            socket.onerror = (e) => {
                logMessage(`WebSocket error: ${e.message}`);
            };
        });

        // Обновление игрового состояния
        function updateGameState(gameState) {
            // Обновляем ракетки
            if (gameState.players) {
                if (gameState.players.player1) {
                    bottomPaddle.style.left = `${gameState.players.player1.x * 100}%`;
                }
                if (gameState.players.player2) {
                    topPaddle.style.left = `${gameState.players.player2.x * 100}%`;
                }
            }

            // Обновляем мяч
            if (gameState.ball) {
                ball.style.left = `${gameState.ball.x * 100}%`;
                ball.style.top = `${gameState.ball.y * 100}%`;
            }

            // Обновляем статус
            if (gameState.started) {
                statusDiv.textContent = "Game started";
            }
        }

        // Управление ракеткой мышью
        gameDisplay.addEventListener('mousemove', (e) => {
            if (!isConnected) return;

            const rect = gameDisplay.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const clampedX = Math.max(0.075, Math.min(0.925, x));

            const moveMsg = {
                type: "racket_move",
                x: clampedX
            };

            socket.send(JSON.stringify(moveMsg));
        });

        // Тестовая отправка случайного движения
        randomMoveBtn.addEventListener('click', () => {
            if (!isConnected) {
                logMessage("Not connected!");
                return;
            }

            const randomX = Math.random();
            const moveMsg = {
                type: "racket_move",
                x: randomX
            };

            socket.send(JSON.stringify(moveMsg));
            logMessage(`Sent random position: ${randomX.toFixed(2)}`);
        });

        // Логирование в debug-окно
        function logMessage(msg) {
            const p = document.createElement('p');
            p.textContent = msg;
            debugDiv.appendChild(p);
            debugDiv.scrollTop = debugDiv.scrollHeight;
        }
    </script>
</body>

</html>
